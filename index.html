<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Challivretou</title>
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <div class="brand-header">
    <img src="/logo.png" alt="Challivretou">
  </div>
  <div class="search-box">
    <input type="search" id="searchInput" placeholder="Rechercher rue, numéro..." autofocus>
    <button class="clear-btn" id="clearBtn">×</button>
  </div>
  <div class="status-bar">
    <span id="itemCount">Chargement...</span>
    <div class="status-right">
      <button id="filterRecentBtn" class="btn-toggle-recent">🕒 Récents</button>
      <button id="installBtn" class="btn-install">📲 Installer</button>
      <span id="syncStatus">⏳ Connexion...</span>
    </div>
  </div>
</header>

<div class="list" id="codeList"></div>
<button class="btn-add" id="openAddModal">+</button>

<!-- Popup Installation PWA -->
<div class="modal" id="installPopupModal">
  <div class="modal-content" style="text-align: center;">
    <div style="font-size: 40px; margin-bottom: 10px;">📲</div>
    <h3 style="font-size: 18px; margin-bottom: 8px;">Installer l'application ?</h3>
    <p style="font-size: 14px; color: #94a3b8; margin-bottom: 20px; line-height: 1.4;">
      Ajoutez <strong>Challivretou</strong> sur votre écran d'accueil pour y accéder en 1 clic en tournée.
    </p>
    <div style="display:flex; justify-content:center; gap:12px;">
      <button class="btn-cancel" id="dismissInstallPopup">Plus tard</button>
      <button class="btn-save" id="confirmInstallPopup">Installer</button>
    </div>
  </div>
</div>

<!-- Modal Édition / Ajout -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h3 id="modalTitle">Modifier</h3>
    <label style="font-size: 13px; color: #94a3b8;">Adresse / Repère</label>
    <input type="text" id="modalAddress">
    <label style="font-size: 13px; color: #94a3b8;">Code</label>
    <input type="text" id="modalCode">
    <div class="modal-btns">
      <div class="modal-btns-left">
        <button class="btn-delete" id="deleteBtn" title="Supprimer votre ajout">🗑️ Suppr.</button>
        <button class="btn-hs-toggle" id="hsToggleBtn">⚠️ Signaler HS</button>
      </div>
      <div class="modal-btns-right">
        <button class="btn-cancel" id="cancelModal">Annuler</button>
        <button class="btn-save" id="saveModal">Sauvegarder</button>
      </div>
    </div>
  </div>
</div>
<div class="modal" id="dialogModal">
  <div class="modal-content">
    <h3 id="dialogTitle" style="font-size: 17px; margin-bottom: 10px;"></h3>
    <p id="dialogMessage" style="font-size: 14px; color: #cbd5e1; line-height: 1.5; white-space: pre-line; margin-bottom: 20px;"></p>
    <div class="modal-btns" style="justify-content: flex-end; gap: 10px;">
      <button class="btn-cancel" id="dialogCancelBtn">Annuler</button>
      <button class="btn-save" id="dialogOkBtn">OK</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/app.js" defer></script>
</body>
</html>
